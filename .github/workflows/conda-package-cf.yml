name: Conda package using conda-forge

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: ubuntu-latest
      conda-subdir: linux-64
      pkgs-dir: /home/runner/conda_pkgs_dir
      channels-list: -c conda-forge --override-channels
      recipe-dir: conda-recipe-cf

  windows:
    name: windows
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: windows-latest
      conda-subdir: win-64
      pkgs-dir: D:\conda_pkgs_dir
      channels-list: -c conda-forge --override-channels
      recipe-dir: conda-recipe-cf

  osx:
    name: osx
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: macos-26-intel
      conda-subdir: osx-64
      pkgs-dir: /Users/runner/conda_pkgs_dir
      channels-list: -c conda-forge --override-channels
      recipe-dir: conda-recipe-cf
