name: Conda package using conda-forge

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build like conda-forge/mkl-service-feedstock: the feedstock's Python versions
# plus 3.15t, which it doesn't build yet, and Visual Studio 2022 on Windows
jobs:
  linux:
    name: linux
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: ubuntu-latest
      conda-subdir: linux-64
      channels-list: -c conda-forge --override-channels
      recipe-dir: conda-recipe-cf
      python-versions: '["3.11", "3.12", "3.13"]'

  windows:
    name: windows
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: windows-2022
      conda-subdir: win-64
      channels-list: -c conda-forge --override-channels
      recipe-dir: conda-recipe-cf
      python-versions: '["3.11", "3.12", "3.13"]'

  osx:
    name: osx
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: macos-26-intel
      conda-subdir: osx-64
      channels-list: -c conda-forge --override-channels
      recipe-dir: conda-recipe-cf
      python-versions: '["3.11", "3.12", "3.13"]'
