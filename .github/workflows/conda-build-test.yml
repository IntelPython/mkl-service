name: Reusable conda build and test

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner image to execute the jobs on
        required: true
        type: string
      conda-subdir:
        description: Conda platform subdir (e.g. linux-64, win-64, osx-64)
        required: true
        type: string
      channels-list:
        description: Conda channels to build and test against
        required: true
        type: string
      recipe-dir:
        description: Path to the conda recipe directory
        required: true
        type: string
      build-wheels:
        description: Whether to build and upload wheel packages
        required: false
        default: false
        type: boolean
      python-versions:
        description: JSON list of Python versions to build and test in addition to 3.14 and 3.15, which always get both the GIL and free-threaded builds
        required: false
        default: '["3.10", "3.11", "3.12", "3.13"]'
        type: string

permissions:
  contents: read

env:
  package-name: mkl-service

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
        include:
          - python: '3.14'
            python_spec: '3.14.* *_cp314'
            python_tag: '3.14'
          - python: '3.14'
            python_spec: '3.14.* *_cp314t'
            python_tag: '3.14t'
          - python: '3.15'
            python_spec: '3.15.* *_cp315'
            python_tag: '3.15'
          - python: '3.15'
            python_spec: '3.15.* *_cp315t'
            python_tag: '3.15t'

    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: ''

      - name: Install conda-build
        run: conda install -n base -y conda-build

      - name: Store conda paths as envs
        env:
          CONDA_SUBDIR: ${{ inputs.conda-subdir }}
        run: |
          echo "CONDA_BLD=$CONDA/conda-bld/${CONDA_SUBDIR}" >> "$GITHUB_ENV"
          if [ "${{ inputs.build-wheels }}" = "true" ]; then
            echo "WHEELS_OUTPUT_FOLDER=${{ github.workspace }}" >> "$GITHUB_ENV"
          fi

      - name: Build conda package
        env:
          CHANNELS_LIST: ${{ inputs.channels-list }}
          RECIPE_DIR: ${{ inputs.recipe-dir }}
          PYTHON_SPEC: ${{ matrix.python_spec || matrix.python }}
        run: |
          # CHANNELS_LIST intentionally word-splits into multiple -c args
          # shellcheck disable=SC2086
          conda build --no-test --python "${PYTHON_SPEC}" ${CHANNELS_LIST} "${RECIPE_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.package-name }} ${{ runner.os }} Python ${{ matrix.python_tag || matrix.python }}
          path: ${{ env.CONDA_BLD }}/${{ env.package-name }}-*.conda

      - name: Upload wheels artifact
        if: ${{ inputs.build-wheels }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.package-name }} ${{ runner.os }} Wheels Python ${{ matrix.python_tag || matrix.python }}
          path: ${{ env.WHEELS_OUTPUT_FOLDER }}/mkl_service-*.whl

  test:
    name: Test
    needs: build

    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
        include:
          - python: '3.14'
            python_spec: '3.14.* *_cp314'
            python_tag: '3.14'
          - python: '3.14'
            python_spec: '3.14.* *_cp314t'
            python_tag: '3.14t'
          - python: '3.15'
            python_spec: '3.15.* *_cp315'
            python_tag: '3.15'
          - python: '3.15'
            python_spec: '3.15.* *_cp315t'
            python_tag: '3.15t'

    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15

    defaults:
      run:
        shell: bash -el {0}

    env:
      pkg-dir: './pkgs'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.package-name }} ${{ runner.os }} Python ${{ matrix.python_tag || matrix.python }}
          path: ${{ env.pkg-dir }}

      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: ''

      - name: Install conda-build
        run: conda install -n base -y conda-build

      - name: Test conda package
        env:
          CHANNELS_LIST: ${{ inputs.channels-list }}
        run: |
          # Runs the test section of the recipe embedded in the package, in a
          # new environment whose Python comes from the package's python_abi
          # CHANNELS_LIST intentionally word-splits into multiple -c args
          # shellcheck disable=SC2086
          conda build --test "${{ env.pkg-dir }}"/${{ env.package-name }}-*.conda ${CHANNELS_LIST}
