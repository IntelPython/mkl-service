c_compiler:                   # [linux]
    - gcc                     # [linux]
c_compiler_version:           # [linux]
    - '15'                    # [linux]
c_stdlib:                     # [linux]
    - sysroot                 # [linux]
c_stdlib_version:             # [linux]
    - '2.17'                  # [linux]
c_compiler:                   # [osx]
    - clang                   # [osx]
c_compiler_version:           # [osx]
    - '21'                    # [osx]
c_stdlib:                     # [osx]
    - macosx_deployment_target  # [osx]
c_stdlib_version:             # [osx]
    - '11.0'                  # [osx]
MACOSX_DEPLOYMENT_TARGET:     # [osx]
    - '11.0'                  # [osx]
c_stdlib:                     # [win]
    - vs                      # [win]
c_compiler:                   # [win]
    - vs2022                  # [win]
mkl_devel:                    # [not osx]
    - '2026'                  # [not osx]
# Python versions of conda-forge/mkl-service-feedstock, plus 3.15t; CI builds
# and tests one job per entry, see .github/workflows/conda-build-test.yml
python:
    - 3.11.* *_cpython
    - 3.12.* *_cpython
    - 3.13.* *_cp313
    - 3.14.* *_cp314
    - 3.14.* *_cp314t
    - 3.15.* *_cp315
    - 3.15.* *_cp315t
